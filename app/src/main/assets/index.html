<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PDF Detail Finder</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,Helvetica,sans-serif}
header{background:#172033;color:#fff;padding:20px 18px 18px}
h1{margin:0;font-size:22px}.sub{margin-top:5px;font-size:12px;opacity:.7}
main{max-width:760px;margin:auto;padding:14px}
.searchbox{display:flex;gap:8px}
input{flex:1;min-width:0;padding:14px 15px;border:1px solid #d6dbe5;border-radius:12px;font-size:16px;background:#fff}
button{border:0;border-radius:12px;padding:0 17px;background:#2563eb;color:white;font-weight:700}
.helper{font-size:12px;color:#697386;margin:9px 2px 14px}
.summary{font-size:13px;color:#596579;margin:12px 2px}
.card{background:white;border:1px solid #e2e6ee;border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.name{font-size:19px;font-weight:700;margin-bottom:6px;text-transform:capitalize}
.meta{font-size:12px;color:#697386;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#8992a3;margin-bottom:3px}
.value{font-size:14px;line-height:1.3;color:#263246}
.full{grid-column:1/-1}
.epic{font-family:monospace;font-weight:700;letter-spacing:.3px}
.open{display:inline-block;margin-top:13px;padding:9px 12px;border-radius:9px;background:#eef4ff;color:#205bc8;font-size:12px;font-weight:700;text-decoration:none}
.empty{background:white;border:1px dashed #cbd2df;border-radius:14px;padding:28px 16px;text-align:center;color:#687386}
</style>
</head>
<body>
<header>
  <h1>PDF Detail Finder</h1>
  <div class="sub">Search 783 indexed voter records offline</div>
</header>
<main>
  <div class="card">
    <div class="searchbox">
      <input id="q" placeholder="Search name, EPIC, school, address..." autocomplete="off">
      <button onclick="searchRecords()">Search</button>
    </div>
    <div class="helper">Try: Reshma · Bhosale · XUA7363955 · Someshwar</div>
  </div>
  <div id="summary" class="summary"></div>
  <div id="results"></div>
</main>

<script>
let records=[];
fetch("records.json").then(r=>r.json()).then(x=>{
  records=x;
  document.getElementById("summary").textContent=records.length+" records ready";
}).catch(()=>{
  document.getElementById("summary").textContent="Could not load local record database.";
});

function esc(s){
 return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function norm(s){return String(s||"").toLowerCase().replace(/\s+/g," ").trim();}
function searchRecords(){
 const q=norm(document.getElementById("q").value);
 const results=document.getElementById("results");
 if(!q){
   document.getElementById("summary").textContent=records.length+" records ready";
   results.innerHTML='<div class="empty">Type a name, EPIC number, institute or address to search.</div>';
   return;
 }
 const terms=q.split(/\s+/).filter(Boolean);
 const fields=["name","relative","address","institute","age","gender","epic"];
 const matches=records.map(r=>{
   const blob=norm(fields.map(k=>r[k]).join(" "));
   const hits=terms.filter(t=>blob.includes(t)).length;
   return {r,hits};
 }).filter(x=>x.hits===terms.length)
   .sort((a,b)=>norm(a.r.name).localeCompare(norm(b.r.name))||a.r.sr_no-b.r.sr_no)
   .map(x=>x.r);

 document.getElementById("summary").textContent=matches.length+" matching record"+(matches.length===1?"":"s");
 if(!matches.length){
   results.innerHTML='<div class="empty">No matching record found.<br><br>Try a shorter search such as <b>Reshma</b> or an EPIC number.</div>';
   return;
 }
 results.innerHTML=matches.slice(0,100).map(r=>`
  <div class="card">
   <div class="name">${esc(r.name)}</div>
   <div class="meta">Sr. No. ${esc(r.sr_no)} &nbsp;•&nbsp; Page ${esc(r.page)}</div>
   <div class="grid">
    <div><div class="label">Age / Gender</div><div class="value">${esc(r.age)} / ${esc(r.gender)}</div></div>
    ${r.epic?`<div><div class="label">EPIC No.</div><div class="value epic">${esc(r.epic)}</div></div>`:""}
    <div class="full"><div class="label">Relative</div><div class="value">${esc(r.relative)}</div></div>
    <div class="full"><div class="label">Institute</div><div class="value">${esc(r.institute)}</div></div>
    <div class="full"><div class="label">Address</div><div class="value">${esc(r.address)}</div></div>
   </div>
   <a class="open" href="file:///android_asset/TAC3_DIST490_PART5_EN.pdf#page=${r.page}">VIEW PDF PAGE ${r.page}</a>
  </div>`).join("");
}
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")searchRecords()});
</script>
</body>
</html>
